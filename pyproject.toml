[project]
name = "bside"
version = "0.1.0"
description = "B-Side — the release kit engine for podcasts and recorded talks. Genblaze + Backblaze B2."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "genblaze>=0.4",
    "genblaze-assemblyai",
    "genblaze-google",
    "genblaze-nvidia[chat]",
    "genblaze-elevenlabs",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["server"]
include = ["bside*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
