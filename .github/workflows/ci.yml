name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -q ffmpeg

      - name: Install server
        run: pip install -e ".[dev]" pytest httpx

      - name: Lint
        run: ruff check server

      - name: Unit + E2E tests (no credentials required)
        run: pytest server/tests/unit server/tests/e2e -q

      - name: Live B2 integration tests
        if: ${{ github.event_name == 'push' }}
        env:
          BSIDE_LIVE_B2: ${{ secrets.B2_KEY_ID != '' && '1' || '' }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_REGION: ${{ secrets.B2_REGION }}
        run: |
          if [ -n "$BSIDE_LIVE_B2" ]; then
            pytest server/tests/integration -q
          else
            echo "B2 secrets not configured — integration suite skipped honestly"
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build SPA (includes type check)
        working-directory: web
        run: |
          npm ci
          npm run build
